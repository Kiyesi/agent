# The wording for every check, in English. This file is the single source of
# the words: the agent embeds it, and the docs pages are built from it.
#
# Placeholders such as {port} are filled in by the agent. A finding's
# severity is critical, warning or info. "root" says whether the check needs
# root to read what it needs, and why. Without root, such a check is skipped,
# never counted as passed.

version: 1
language: en
total_checks: 25

skips:
  needs-root: "needs root: run sudo kiyesi scan"
  not-linux: "runs only on Linux"
  timeout: "took too long and was stopped"
  failed: "could not finish: {reason}"

checks:
  # ---------------------------------------------------------------- Health

  - id: load
    area: health
    name: Load
    reads: The 15-minute load average in /proc/loadavg and the number of CPU cores in /proc/cpuinfo.
    root:
      needed: never
    passed: "15-minute load is {load} per CPU core"
    findings:
      high:
        severity: warning
        sentence: "The 15-minute load is {load} per CPU core, above {limit}"
        why: >-
          A load this high for this long usually means the server is too small for its work,
          or one process is stuck. Load is a stand-in for CPU use until this server is
          connected and Kiyesi can watch CPU every minute.
        fix: "ps -eo pid,comm,%cpu --sort=-%cpu | head -n 6"

  - id: memory
    area: health
    name: Memory and swap
    reads: Memory and swap totals in /proc/meminfo.
    root:
      needed: never
    passed: "{percent}% of {total} memory in use"
    findings:
      high:
        severity: warning
        sentence: "Memory is {percent}% in use, above {limit}%"
        why: >-
          When memory runs out, Linux kills a process to free it, usually the biggest one,
          which is often the app.
        fix: "ps -eo pid,comm,rss --sort=-rss | head -n 6"
      no-swap:
        severity: warning
        sentence: "This server has {total} of memory and no swap"
        why: >-
          On a server under 2 GB with no swap, one spike in memory gets the app killed.
          Swap gives it room to survive the spike.
        fix: >-
          sudo fallocate -l 1G /swapfile && sudo chmod 600 /swapfile &&
          sudo mkswap /swapfile && sudo swapon /swapfile &&
          echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab

  - id: disk
    area: health
    name: Disk
    reads: The mounted file systems in /proc/self/mounts, and the space and inodes on each.
    root:
      needed: never
    passed: "Every disk is under {limit}% full"
    findings:
      space-warning:
        severity: warning
        sentence: "Disk {mount} is {percent}% full"
        why: When a disk fills, databases stop writing and apps crash.
        fix: "sudo du -xh {mount} --max-depth=2 2>/dev/null | sort -rh | head -n 15"
      space-critical:
        severity: critical
        sentence: "Disk {mount} is {percent}% full"
        why: When a disk fills, databases stop writing and apps crash. This one is nearly there.
        fix: "sudo du -xh {mount} --max-depth=2 2>/dev/null | sort -rh | head -n 15"
      inodes-warning:
        severity: warning
        sentence: "Disk {mount} has used {percent}% of its inodes"
        why: >-
          When inodes run out, no new file can be created even with space left. Many tiny
          files, such as old sessions or cache entries, cause it.
        fix: "sudo find {mount} -xdev -type f | cut -d/ -f2-3 | sort | uniq -c | sort -rn | head"
      inodes-critical:
        severity: critical
        sentence: "Disk {mount} has used {percent}% of its inodes"
        why: >-
          When inodes run out, no new file can be created even with space left. This disk is
          nearly there.
        fix: "sudo find {mount} -xdev -type f | cut -d/ -f2-3 | sort | uniq -c | sort -rn | head"

  - id: containers
    area: health
    name: Containers
    reads: Each container's state, restart count and health status, read from the Docker socket.
    root:
      needed: sometimes
      why: The Docker socket can be read only by root and the docker group.
    passed: "{count|No containers|container|containers} running, none failing"
    passed-none: "No containers on this server"
    findings:
      exited:
        severity: warning
        sentence: "Container {name} has stopped (exit code {code})"
        why: A stopped container is a service that is not running.
        fix: "docker logs --tail 50 {name}"
      unhealthy:
        severity: warning
        sentence: "Container {name} is failing its health check"
        why: Docker reports the container as unhealthy, so it is running but not answering properly.
        fix: "docker inspect --format '{{json .State.Health.Log}}' {name}"
      restarts:
        severity: warning
        sentence: "Container {name} restarted {count|time|times} in the last hour"
        why: A container that keeps restarting is crashing, and users see errors each time.
        fix: "docker logs --tail 100 {name}"

  - id: oom
    area: health
    name: Out-of-memory kills
    reads: The kernel log for the last 24 hours, through journalctl or /var/log/kern.log.
    root:
      needed: sometimes
      why: On Ubuntu the kernel log can be read only by root and the adm group.
    passed: "No process was killed for memory in the last 24 hours"
    skips:
      no-kernel-log: "found no kernel log: neither journald nor /var/log/kern.log is on this system"
    findings:
      killed-no-swap:
        severity: critical
        sentence: "The {process} process was killed for using too much memory at {time}"
        why: >-
          This server has {total} of memory and no swap, so one spike takes the app down.
        fix: >-
          sudo fallocate -l 1G /swapfile && sudo chmod 600 /swapfile &&
          sudo mkswap /swapfile && sudo swapon /swapfile &&
          echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
      killed:
        severity: critical
        sentence: "The {process} process was killed for using too much memory at {time}"
        why: >-
          When memory runs out, Linux kills the biggest process, and everyone using it gets
          errors. Set a memory limit on the container that grows, or move to a server with
          more memory.
        fix: "ps -eo pid,comm,rss --sort=-rss | head -n 6"

  - id: certificates
    area: health
    name: SSL certificates
    reads: >-
      The certificates in /etc/letsencrypt/live, Caddy's certificate folders, and the
      certificate files named in nginx and Apache settings.
    root:
      needed: sometimes
      why: Certificate folders such as /etc/letsencrypt/live can be read only by root.
    passed: "{count|certificate|certificates}, none expiring within {limit} days"
    passed-none: "No certificates found on this server"
    findings:
      expiring:
        severity: warning
        auto: certificates
        sentence: "SSL certificate for {host} expires {days|in}"
        why: When it expires, browsers and apps will refuse to connect.
        fix: "sudo certbot renew"
        fix-variants:
          caddy: "Caddy renews by itself, so find out why it has not: sudo journalctl -u caddy --since -24h | grep -i error"
          other: "Renew the certificate at {path} with whoever issued it, then reload the web server"
      expired:
        severity: critical
        auto: certificates
        sentence: "SSL certificate for {host} expired {days|ago}"
        why: Browsers and apps are refusing to connect to {host} now.
        fix: "sudo certbot renew --force-renewal"
        fix-variants:
          caddy: "Caddy renews by itself, so find out why it has not: sudo journalctl -u caddy --since -24h | grep -i error"
          other: "Renew the certificate at {path} with whoever issued it, then reload the web server"

  - id: backups
    area: health
    name: Backups
    reads: >-
      The age of the newest file in each backup folder named in /etc/kiyesi/config.yaml, and that
      file itself, read through once when it is new (gzip, zip, tar, and PostgreSQL and MySQL dumps),
      to check it would restore. Nothing is unpacked or sent.
    root:
      needed: sometimes
      why: Backup folders are often readable only by root.
    passed: "Newest backup is {age} old{opens}"
    skips:
      elsewhere: >-
        this server keeps no database of its own: its data is in {where}, backed up there by its
        provider's plan, which Kiyesi cannot see from here. Check backups are on in its settings:
        some free plans keep none
      offsite: >-
        backups go to {to}, which Kiyesi cannot open from here to check their age. To have it
        check them, name a folder on this server they are also written to under backups.paths in
        /etc/kiyesi/config.yaml
      no-data: >-
        found no database on this server, in its containers or in its apps' settings. If it keeps
        files that matter, add the folder their backups are written to under backups.paths in
        /etc/kiyesi/config.yaml
    findings:
      not-set:
        severity: warning
        sentence: No backup is set up for Kiyesi to check
        why: >-
          This server keeps a database of its own. Without a backup, a failed disk or one wrong
          command loses its data for good. If you do have backups, tell Kiyesi where they are
          written.
        fix: "Add the backup folder under backups.paths in /etc/kiyesi/config.yaml"
      empty:
        severity: warning
        sentence: "No backup found in {path}"
        why: The backup folder is set up but holds no files, so the backup job is not writing there.
        fix: "Find the job that writes it: sudo grep -ril backup /etc/cron* /var/spool/cron 2>/dev/null, and systemctl list-timers --all | grep -i backup"
      old:
        severity: warning
        sentence: "Newest backup is {age} old"
        why: Backups are expected every {limit} hours. The last one was written on {when}.
        fix: "Find the job that writes it: sudo grep -ril backup /etc/cron* /var/spool/cron 2>/dev/null, and systemctl list-timers --all | grep -i backup"
      unreadable:
        severity: critical
        sentence: "The newest backup in {path} would not restore: {reason}"
        why: >-
          A backup that cannot be opened restores nothing, and you find out on the worst day. The
          backup job may have stopped halfway, or the disk filled up while it wrote {file}.
        fix: "Run the backup job by hand, check it finishes without errors, then: sudo kiyesi scan"
      shrank:
        severity: warning
        sentence: "The newest backup in {path} is {size}, down from {before}"
        why: >-
          A backup that suddenly shrinks is often a failed dump: a database that could not be
          reached, a changed password, or a table that went missing. Check {file} holds your data.
        fix: "ls -lh {path}"

  - id: updates
    area: health
    name: Pending updates
    reads: >-
      The security updates apt has waiting, from a dry run that changes nothing
      (apt-get -s upgrade), and the date Kiyesi first saw each one.
    root:
      needed: never
    passed: "No security update has waited more than {limit} days"
    skips:
      no-apt: "needs apt, so it runs on Debian and Ubuntu only"
      memory-limit: "the agent's service has too little memory for apt (an older setting). Raise it with: sudo kiyesi update"
    findings:
      waiting:
        severity: warning
        auto: updates
        sentence: "{count|security update has|security updates have} waited more than {limit} days"
        why: Security updates fix flaws that attackers already know about.
        fix: "sudo apt-get update && sudo apt-get upgrade"

  # -------------------------------------------------------------- Security

  - id: end-of-life
    area: health
    name: Security fixes for the system
    reads: >-
      The system and its version in /etc/os-release, whether Ubuntu Pro's extended fixes are
      on in /var/lib/ubuntu-advantage/status.json, and the end-of-life dates built into
      kiyesi, from the vendors' own pages: ubuntu.com/about/release-cycle and Ubuntu's
      end-of-life announcements, debian.org/releases and wiki.debian.org/LTS, and Red Hat's
      life-cycle page, with endoflife.date for the rest. Nothing is downloaded. The date is
      the last day of free security fixes: for Debian, of its long-term support; for Red Hat
      and its rebuilds, of Maintenance Support. It warns from 90 days before.
    root:
      needed: never
    passed: "{os} gets security fixes until {date}{with}"
    skips:
      unknown-system: "Kiyesi has no end-of-life dates for {os}"
      unknown-release: "{os} is not in the end-of-life dates built into this kiyesi (from {fetched}): sudo kiyesi update may know it"
    findings:
      ended:
        severity: critical
        sentence: "{os} stopped getting security fixes on {date}"
        why: >-
          Every flaw found since, in the system or the programs it came with, stays open:
          updates no longer arrive, so nothing else on the server can make it safe. Plan the
          move now.
        fix: "Take a snapshot first. Move to a release that still gets fixes: upgrade in place, or build a new server on a long-term release and move the apps to it"
        fix-variants:
          ubuntu: "Take a snapshot first. sudo kiyesi guard -- do-release-upgrade moves it to the next release, one release at a time, and checks the services and sites after; on a small server, building a new one on Ubuntu 26.04 LTS and moving the apps to it is often easier"
          debian: "Take a snapshot first. Point apt at the next release as its release notes say, then sudo kiyesi guard -- apt full-upgrade, which checks the services and sites after; or build a new server on Debian 13 and move the apps to it"
          rhel: "Take a snapshot first. sudo kiyesi guard -- leapp upgrade moves it to the next major release in place; or build a new server on a supported release and move the apps to it"
      ending:
        severity: warning
        sentence: "{os} stops getting security fixes on {date}, in {days|less than a day|day|days}"
        why: >-
          After that day, flaws found in the system or the programs it came with stay open.
          Moving takes planning, so start now.
        fix: "Take a snapshot first. Move to a release that still gets fixes: upgrade in place, or build a new server on a long-term release and move the apps to it"
        fix-variants:
          ubuntu: "Take a snapshot first. sudo kiyesi guard -- do-release-upgrade moves it to the next release, one release at a time, and checks the services and sites after; on a small server, building a new one on Ubuntu 26.04 LTS and moving the apps to it is often easier"
          debian: "Take a snapshot first. Point apt at the next release as its release notes say, then sudo kiyesi guard -- apt full-upgrade, which checks the services and sites after; or build a new server on Debian 13 and move the apps to it"
          rhel: "Take a snapshot first. sudo kiyesi guard -- leapp upgrade moves it to the next major release in place; or build a new server on a supported release and move the apps to it"
      lts:
        severity: info
        sentence: "{os} is in long-term support: security fixes until {date}, for most packages"
        why: >-
          Debian's own security team has handed this release to its long-term support team,
          which keeps fixing the packages most servers use, but not every package. Nothing
          to do now; plan the move before the date.
        fix: "Nothing to do yet. To see which installed packages long-term support leaves out: sudo apt install debian-security-support, then check-support-status. Kiyesi warns 90 days before the date"

  - id: open-ports
    area: security
    name: Open ports
    reads: The ports listening on public addresses, from /proc/net/tcp and /proc/net/tcp6, and the ports Docker publishes.
    root:
      needed: never
    passed: "Only allowed ports are open ({ports})"
    findings:
      provider:
        severity: info
        sentence: "Port {port} listens on a public address, behind your provider's firewall"
        why: >-
          The settings say your provider's firewall protects this server, which Kiyesi cannot see
          from inside: that firewall decides who reaches port {port}.
        fix: "Check your provider's firewall allows {port} only from where it should be reached"
      open:
        severity: warning
        sentence: "Port {port} is open on a public address"
        why: >-
          Every open port is a way in. Only ports you mean to serve should be open. If this one
          should be open, add it to ports.allowed in /etc/kiyesi/config.yaml.
        fix: "Bind the program to 127.0.0.1 if only this server needs it. Or keep it behind the firewall: with none on, allow SSH first (sudo ufw allow 22/tcp, or the port you sign in on), then sudo ufw enable; with ufw on, sudo ufw status numbered shows the rule that allows {port}, and sudo ufw delete <number> removes it"

  - id: exposed-databases
    area: security
    name: Exposed databases
    reads: >-
      Whether MongoDB, Redis, PostgreSQL or MySQL listen on a public address or are published
      by Docker, and whether the firewall on this server blocks them.
    root:
      needed: sometimes
      why: Reading the firewall rules needs root.
    passed: "No database is open to the internet"
    findings:
      provider:
        severity: warning
        sentence: "{database} listens on a public address on port {port}, behind your provider's firewall"
        why: >-
          Only your provider's firewall, which Kiyesi cannot see from inside, keeps {database} from
          the internet. One wrong rule there opens it to everyone.
        fix: "Bind {database} to 127.0.0.1 or a private address if only this server or your private network needs it, and check your provider's firewall does not allow {port} from the internet"
      open:
        severity: critical
        confidence: likely
        sentence: "{database} is open to the internet on port {port}"
        why: >-
          Anyone can connect and read or wipe the data. A cloud firewall outside the server
          cannot be seen from here, so this is likely, not confirmed.
        fix: "bind the port to 127.0.0.1 in docker-compose.yml, then\ndocker compose up -d {service}"
        fix-variants:
          docker-run: "recreate the container with -p 127.0.0.1:{port}:{port} in place of -p {port}:{port}"
          redis: "set bind 127.0.0.1 ::1 in /etc/redis/redis.conf, then sudo systemctl restart redis-server"
          mongodb: "set bindIp: 127.0.0.1 under net: in /etc/mongod.conf, then sudo systemctl restart mongod"
          postgresql: "set listen_addresses = 'localhost' in postgresql.conf, then sudo systemctl restart postgresql"
          mysql: "set bind-address = 127.0.0.1 in /etc/mysql/mysql.conf.d/mysqld.cnf, then sudo systemctl restart mysql"

  - id: docker-firewall
    area: security
    name: Docker bypassing the firewall
    reads: The ports Docker publishes on all addresses, and the ufw rules for them.
    root:
      needed: sometimes
      why: Reading the ufw rules and the Docker socket needs root.
    passed: "Docker publishes no port the firewall says is closed"
    findings:
      bypass:
        severity: warning
        sentence: "Docker publishes port {port} past the firewall"
        why: >-
          ufw says this port is closed, but Docker opens it anyway, so it can be reached from
          the internet.
        fix: "bind the port to 127.0.0.1 in docker-compose.yml, then\ndocker compose up -d {service}"
      web:
        severity: info
        sentence: "Docker publishes web port {port} past the firewall"
        why: >-
          ufw says port {port} is closed, but Docker opens it anyway. For a website that is
          what you want, so it costs no points, but the firewall's rules no longer say what is
          open. Never bind it to 127.0.0.1 if it serves your site: the site would go offline.
        fix: "If {service} serves your website, allow the port in the firewall too, so its rules say what is open:\nsudo ufw allow {port}/tcp\nIf it should not be public, bind it to 127.0.0.1 in docker-compose.yml, then\ndocker compose up -d {service}"

  - id: ssh
    area: security
    name: SSH settings
    reads: /etc/ssh/sshd_config and the files in /etc/ssh/sshd_config.d.
    root:
      needed: never
    passed: "SSH allows neither root login nor password login"
    passed-none: "No SSH server on this machine"
    findings:
      password:
        severity: warning
        auto: ssh-password
        sentence: SSH allows password login
        why: Passwords can be guessed by automated attacks. Keys cannot. Check that your key works before you turn passwords off.
        fix: >-
          echo "PasswordAuthentication no" | sudo tee /etc/ssh/sshd_config.d/00-kiyesi-no-password.conf &&
          sudo systemctl reload ssh
      root:
        severity: warning
        auto: ssh-root
        sentence: SSH allows root login
        why: >-
          Attackers try root first. Sign in as a normal user and use sudo. Check that such a
          user can sign in before you turn root login off.
        fix: >-
          echo "PermitRootLogin no" | sudo tee /etc/ssh/sshd_config.d/00-kiyesi-no-root.conf &&
          sudo systemctl reload ssh

  - id: firewall
    area: security
    name: Firewall
    reads: Whether ufw, firewalld or an nftables or iptables rule set is on.
    root:
      needed: sometimes
      why: When ufw and firewalld are off, reading nftables or iptables rules needs root.
    passed: "The firewall is on ({firewall})"
    findings:
      off:
        severity: warning
        auto: firewall
        sentence: No firewall is on
        why: >-
          Without a firewall, every port a program opens can be reached from the internet. If
          your provider's firewall protects this server (such as DigitalOcean's Cloud Firewall or
          an AWS security group), Kiyesi cannot see it from inside: say so with
          provider_firewall: true under ports in /etc/kiyesi/config.yaml.
        fix: "sudo ufw allow {ssh_port}/tcp && sudo ufw enable"

  - id: login-protection
    area: security
    name: Login attack protection
    reads: Whether fail2ban, sshguard or CrowdSec is running, and whether SSH allows password login.
    root:
      needed: never
    passed: "{protection}"
    findings:
      missing:
        severity: warning
        auto: login-protection
        sentence: Nothing blocks repeated SSH password guesses
        why: >-
          SSH allows password login and nothing locks out an address that keeps guessing.
          Turning off password login also solves this.
        fix: "sudo apt-get install -y fail2ban && sudo systemctl enable --now fail2ban"

  - id: secrets-in-files
    area: security
    name: Secrets in files
    reads: >-
      Environment files, Compose files and shell history in the folders listed under
      secrets.paths in /etc/kiyesi/config.yaml. Kiyesi reports where a secret is, never its value.
    root:
      needed: sometimes
      why: Other users' files and /root can be read only by root.
    passed: "No exposed secrets in {count|file|files} checked"
    findings:
      world-readable:
        severity: warning
        auto: secret-files
        sentence: "{path} holds secrets and every user on this server can read it"
        why: Any user or program on the server can read the secrets in this file.
        fix: "sudo chmod 600 {path}"
      readable-closed:
        severity: info
        auto: secret-files
        sentence: "{path} holds secrets and is set readable by everyone, but {folder} keeps other users out"
        why: >-
          Nobody else can reach it now, as {folder} lets only its owner through. If that folder or
          the file is ever moved or opened up, every user could read the secrets. Tightening the
          file costs nothing.
        fix: "sudo chmod 600 {path}"
      in-compose:
        severity: warning
        sentence: "A secret is written into {path} at line {line}"
        why: >-
          Anyone who can read this file, or the repository it is in, has the secret. Keep
          secrets in an env file only the owner can read.
        fix: "Move the value to an env file with chmod 600, and point env_file at it in {path}"
      in-history:
        severity: warning
        sentence: "A secret was typed into shell history in {path} at line {line}"
        why: Shell history is kept in plain text, so the secret stays on disk after the command ran.
        fix: "Delete line {line} from {path}, then change the secret"

  - id: risky-containers
    area: security
    name: Risky containers
    reads: Each running container's settings for privileged mode, mounted volumes and user, read from the Docker socket.
    root:
      needed: sometimes
      why: The Docker socket can be read only by root and the docker group.
    passed: "No container is privileged, has the Docker socket, or runs as root"
    passed-none: "No containers on this server"
    findings:
      privileged:
        severity: critical
        sentence: "Container {name} runs in privileged mode"
        why: A privileged container can take over the whole server.
        fix: "Remove privileged: true from the service in docker-compose.yml, and add only the capabilities it needs"
      docker-socket:
        severity: critical
        sentence: "Container {name} has the Docker socket mounted"
        why: Whoever controls this container controls Docker, and so the whole server.
        fix: "Remove the /var/run/docker.sock volume from the service, or give it a read-only socket proxy"
      root:
        severity: warning
        sentence: "Container {name} runs as root"
        why: If the app is broken into, the attacker is root inside the container, one step from the server.
        fix: "Add user: \"1000:1000\" to the service in docker-compose.yml, or a USER line to its Dockerfile"

  - id: vulnerabilities
    area: security
    name: Known vulnerabilities
    reads: >-
      System packages and container images, checked by Trivy if it is already installed.
      Kiyesi never downloads Trivy or its database during a scan.
    root:
      needed: sometimes
      why: Trivy needs root to read every system package and the Docker socket.
    passed: "No critical vulnerability with a fix available"
    skips:
      not-installed: "Trivy is not installed. Install Trivy 0.74.0 or newer to check"
      no-database: "Trivy has no vulnerability database here, and Kiyesi never downloads one during a scan. Run trivy image --download-db-only once, then scan again"
      bad-version: "Trivy {version} is a compromised release from March 2026. Remove it and install 0.74.0 or newer"
      failed: "Trivy could not finish: {reason}"
    findings:
      system:
        severity: warning
        auto: updates
        sentence: "{count|critical vulnerability|critical vulnerabilities} with a fix available in this server's packages"
        why: These flaws are public and already fixed. Installing the updates closes them; a new kernel needs a restart afterwards.
        fix: "sudo apt-get update && sudo apt-get upgrade --with-new-pkgs && sudo apt-get autoremove --purge"
      image:
        severity: warning
        sentence: "{count|critical vulnerability|critical vulnerabilities} with a fix available in image {image}"
        why: These flaws are public and already fixed in newer packages for this image.
        fix: "Update the base image of {image}, rebuild it, and restart its containers"

  - id: leftovers
    area: security
    name: Leftovers
    reads: >-
      Env files and wp-config.php in the folders under secrets.paths and the web roots, for
      debug and development settings (the setting's name, never another value); each running
      container's image and environment; Git folders in /var/www and the other web roots;
      the sizes of files in /var/log and of containers' logs; and Docker's own count of
      images and build cache nothing uses.
    root:
      needed: sometimes
      why: The Docker socket, containers' logs and other users' files can be read only by root.
    passed: "Nothing left over from development, and no space wasted on logs or Docker"
    findings:
      debug:
        severity: warning
        sentence: "{path} turns on debug mode: {setting}"
        why: >-
          Debug mode shows visitors error pages with code, settings and sometimes secrets, and
          is slower. It is meant for a developer's machine, not a server the internet reaches.
        fix: "Change {setting} to the production value in {path} (false, or production), then restart the app"
      debug-container:
        severity: warning
        sentence: "Container {name} runs in debug mode: {setting}"
        why: >-
          Debug mode shows visitors error pages with code, settings and sometimes secrets, and
          is slower. It is meant for a developer's machine, not a server the internet reaches.
        fix: "Change {setting} to the production value where the service's environment is set, then docker compose up -d"
      dev-tool-public:
        severity: critical
        sentence: "Container {name} runs {tool}, a development tool, open to the internet"
        why: >-
          Tools like this give whoever reaches them your data or your email, often behind a
          weak password or none, and they are among the first things attackers look for.
        fix: "Remove the service, or publish its port on 127.0.0.1 only (\"127.0.0.1:8080:80\") and reach it with ssh -L 8080:localhost:8080 you@this-server"
      dev-tool:
        severity: warning
        sentence: "Container {name} runs {tool}, a development tool"
        why: >-
          It is not reachable from the internet now, but one port change makes it so, and it
          gives whoever reaches it your data. Run it on your own machine, or only when needed.
        fix: "docker stop {name}, and remove its service from docker-compose.yml"
      git-folder:
        severity: warning
        sentence: "{path} is a Git folder inside the web root"
        why: >-
          If the web server serves it, anyone can download the whole code and its history,
          with every secret ever committed. The grade from outside checks whether it is served.
        fix: "Move it out (sudo mv {path} /root/), and deploy with git archive or rsync --exclude .git next time"
      big-log:
        severity: warning
        sentence: "{path} has grown to {size}"
        why: A log this big is not being rotated. It fills the disk, and old lines are rarely read.
        fix: "Check /etc/logrotate.d has a rule for {path}, then sudo logrotate -f /etc/logrotate.conf (if logrotate is missing: sudo apt-get install -y logrotate)"
      big-container-log:
        severity: warning
        sentence: "Container {name}'s log has grown to {size}, with no size limit"
        why: Docker keeps every line a container writes until its disk is full, unless told a limit.
        fix: "Add to the service in docker-compose.yml: logging: { driver: json-file, options: { max-size: \"20m\", max-file: \"3\" } }, then docker compose up -d"
      docker-waste:
        severity: info
        auto: docker-cleanup
        sentence: "Docker keeps {size} that nothing uses: old images and build cache"
        why: >-
          Each deploy leaves the previous image and its build cache behind. It is disk you pay
          for, and a full disk stops every app on the server. Volumes are never counted.
        fix: "docker image prune -a --filter until=168h && docker builder prune --filter until=168h"

  - id: break-in
    area: security
    name: Signs of a break-in
    reads: >-
      The checksums dpkg --verify or rpm -V compare for programs in the system folders (once a
      day in the background); each running process's name, program path and command line, to
      look for a miner's words (only the name and path are kept); /etc/crontab, /etc/cron.d,
      the cron folders and users' cron tables, systemd's units in /etc/systemd/system and
      users' own, and /etc/rc.local; /etc/passwd; the dates of users' authorized_keys files;
      /etc/ld.so.preload; where users' .bash_history points; and the dates and sizes of the
      sign-in log and the system log. Never a file's contents beyond these, and never a
      command line, which may hold secrets.
    root:
      needed: always
      why: Other users' cron tables, login keys and programs can be read only by root, and "no signs" without them would mislead.
    passed: "No signs of a break-in"
    findings:
      changed-program:
        severity: critical
        sentence: "{count|No system programs differ from their packages|system program differs from its package|system programs differ from their packages}, such as {path}"
        why: >-
          A program in a system folder changed after it was installed is what a backdoor or a
          rootkit leaves behind. An update stopped halfway can do it too, so check before you
          treat the server as broken into.
        fix: "sudo dpkg --verify (or sudo rpm -Va) lists them; reinstall each package (sudo apt-get install --reinstall $(dpkg -S {path} | cut -d: -f1)). If nobody changed them, follow docs.kiyesi.dev/guides/break-in/"
      temp-program:
        severity: critical
        sentence: "Process {name} (pid {pid}) runs a program from {folder}"
        why: >-
          Anyone on the server can write to {folder}, so real software is never installed
          there. It is where attackers drop their tools, because it always works.
        fix: "sudo ls -l /proc/{pid}/exe to see the program, then sudo kill {pid}, and look for what starts it again (this check reads cron and systemd too)"
      miner:
        severity: critical
        sentence: "A crypto miner is running: {name} (pid {pid})"
        why: >-
          Miners are the most common thing attackers run on a server they get into. It earns
          them money, and costs you the CPU, the speed of your apps and often the trust of your
          provider.
        fix: "sudo kill {pid}, then find how it got in and how it starts again: sudo ls /etc/cron.d /var/spool/cron/crontabs /etc/systemd/system 2>/dev/null, and docs.kiyesi.dev/guides/break-in/"
      autostart-temp:
        severity: critical
        sentence: "{path} starts a program from a temporary folder"
        why: >-
          A program that starts itself from /tmp, /var/tmp or /dev/shm is how an attacker comes
          back after a restart. Real jobs run programs installed in the system folders.
        fix: "sudo cat {path}, and remove the entry if nobody on your team added it"
      autostart-download:
        severity: critical
        sentence: "{path} downloads code and runs it, or opens a shell to another machine"
        why: >-
          An entry that fetches a script and runs it, or hands a shell to another address, at
          every start or on a timer, gives someone else the server whenever they want it.
        fix: "sudo cat {path}, and remove the entry if nobody on your team added it"
      extra-root:
        severity: critical
        sentence: "Account {user} has root's powers (user id 0)"
        why: >-
          Only root should have user id 0. A second one is a well-known hidden way back in,
          because it looks like an ordinary account in most lists.
        fix: "sudo grep ':x:0:' /etc/passwd to see it, then sudo userdel {user} if nobody on your team made it"
      preload:
        severity: critical
        sentence: "{path} is loaded into every program through /etc/ld.so.preload"
        why: >-
          This is how many rootkits hide their files and processes from the system
          tools. Very few real programs need it.
        fix: "sudo cat /etc/ld.so.preload. If nobody on your team added it, follow docs.kiyesi.dev/guides/break-in/"
      history-off:
        severity: warning
        sentence: "{user}'s shell history is sent to /dev/null"
        why: >-
          Attackers turn history off to hide what they typed. Some people do it on purpose,
          which also leaves nothing to look back on after a problem.
        fix: "sudo rm ~{user}/.bash_history if nobody on your team set it; the shell starts a new one"
      auth-log-empty:
        severity: warning
        sentence: "{path} is empty and has not changed since {date}, while the other logs go on"
        why: >-
          Every sign-in and use of sudo is written there. A sign-in log that stopped while the
          rest goes on is often one that was wiped to hide a break-in.
        fix: "sudo journalctl -u ssh -u sshd --since -7d to read the sign-ins from the journal, then sudo systemctl restart rsyslog"
      new-account:
        severity: info
        sentence: "Login account {user} was added, first seen {date}"
        why: >-
          Check it was someone on your team. Adding an account is a common way to get back in
          later.
        fix: "sudo journalctl -u ssh -u sshd --since -30d | grep -w {user} to see its sign-ins; sudo userdel -r {user} if nobody knows it"
      new-key:
        severity: info
        sentence: "{user}'s login keys changed on {date}"
        why: >-
          Each line in that file opens the server to whoever holds the key. Check the change
          was someone on your team.
        fix: "sudo kiyesi keys lists each key's fingerprint and comment. On your own computer, ssh-keygen -lf ~/.ssh/id_ed25519.pub prints yours to compare. Take out a key nobody recognises by deleting its line from that account's authorized_keys file (sudo kiyesi keys lists them); never take out your own last key"

  # --------------------------------------------------------- Data location
  # Each data-location finding says confirmed or likely. Only the provider's
  # own details count as confirmed: an address can be placed in the wrong
  # country. Being outside the home country is shown in the report's DATA
  # LOCATION section and does not cost grade points, as in the UI design;
  # only payment data outside the home country is critical.

  - id: server-location
    area: data-location
    name: Server location
    reads: >-
      The cloud provider's own details: /run/cloud-init/instance-data.json, the maker in
      /sys/class/dmi/id/sys_vendor, and the provider's metadata address on its local network
      (169.254.169.254). Nothing is sent there; the scan only reads the region.
    root:
      needed: never
    passed: "This server is in {place}, inside {home}"
    passed-no-home: "This server is in {place}. Choose a home country to compare it with"
    skips:
      unknown: "the provider's details could not be read, so the country is found from this server's address once it is connected"
    findings:
      outside:
        severity: info
        confidence: confirmed
        sentence: "This server is in {place}, outside {home}"
        why: >-
          {home}'s data-location rule applies to data stored on this server. {rule}
          The provider's own details say where it is.
        fix: "Move the server to a region inside {home}, or keep data that must stay in {home} off it"

  - id: database-connections
    area: data-location
    name: Database connections
    reads: >-
      The database hosts in env files, Compose files and connection settings in the folders
      under secrets.paths, and in running containers' environments, by the setting's usual names
      or by a value that is a database's address. Only the host and port are kept, never the
      user or password.
    root:
      needed: sometimes
      why: Other users' files and /root can be read only by root.
    passed: "{count|database host|database hosts} checked, none outside {home}"
    passed-no-home: "{count|database host|database hosts} placed. Choose a home country to compare them with"
    passed-none: "No database connection settings found"
    findings:
      outside:
        severity: info
        confidence: likely
        sentence: "Database {host} is in {place}, outside {home}"
        why: >-
          The region in the host's name places this database in {place}. Names can mislead, so
          this is likely, not confirmed.
        fix: "Move the database to a region inside {home}, or check with the provider where it is"

  - id: backup-destinations
    area: data-location
    name: Backup destinations
    reads: >-
      The storage targets in rclone settings, restic repositories, AWS CLI settings, and the
      backup commands in cron jobs and scripts under secrets.paths.
    root:
      needed: sometimes
      why: rclone settings and cron jobs in /root and other users' folders can be read only by root.
    passed: "{count|backup destination|backup destinations} checked, none outside {home}"
    passed-no-home: "{count|backup destination|backup destinations} placed. Choose a home country to compare them with"
    passed-none: "No backup destination found in the settings Kiyesi reads"
    findings:
      outside:
        severity: info
        confidence: likely
        sentence: "Backups go to {target} in {place}, outside {home}"
        why: >-
          A backup holds a full copy of the data, so the rule for {home} applies to it too.
        fix: "Point the backup at a bucket or server inside {home}"

  - id: outside-services
    area: data-location
    name: Outside services
    reads: >-
      The log, monitoring, email and SMS services named in env files, Compose files and running
      containers' environments, such as Sentry, SMTP hosts, Twilio and Termii.
    root:
      needed: sometimes
      why: Other users' files and /root can be read only by root.
    passed: "{count|outside service|outside services} listed for review"
    passed-none: "No outside log, monitoring, email or SMS service found"
    findings: {}

  - id: payment-data
    area: data-location
    name: Payment data tag
    reads: The databases listed under payment_data in /etc/kiyesi/config.yaml.
    root:
      needed: never
    passed: "{count|database|databases} marked as holding payment data, all inside {home}"
    passed-no-home: "{count|database|databases} marked as holding payment data. Choose a home country to compare them with"
    passed-none: "No database is marked as holding payment data. List them under payment_data in /etc/kiyesi/config.yaml"
    findings:
      outside:
        severity: critical
        sentence: "Payment data in {host} is stored outside {home}"
        why: >-
          You marked {host} as holding payment data, and it is in {place}. {rule}
        fix: "Move {host} to a provider inside {home} before the rule's deadline"
