# Cloud providers and their regions, for the data-location checks.
#
# vendors: what the provider writes in /sys/class/dmi/id/sys_vendor.
# cloud_init: the cloud_name cloud-init reports in /run/cloud-init/instance-data.json.
# hosts: hostname patterns for managed databases and storage. (?P<region>...)
#   captures the region code, which is looked up in regions.
# regions: region code -> city and ISO country code.

version: 1
providers:
  - id: digitalocean
    name: DigitalOcean
    vendors: [DigitalOcean]
    cloud_init: [digitalocean]
    hosts:
      - '^db-[a-z]+-(?P<region>[a-z]+\d)-\d+-do-user-.*\.db\.ondigitalocean\.com$'
      - '^(?P<region>[a-z]+\d)\.digitaloceanspaces\.com$'
      - '\.(?P<region>[a-z]+\d)\.digitaloceanspaces\.com$'
    regions:
      nyc1: { city: New York, country: US }
      nyc2: { city: New York, country: US }
      nyc3: { city: New York, country: US }
      sfo2: { city: San Francisco, country: US }
      sfo3: { city: San Francisco, country: US }
      atl1: { city: Atlanta, country: US }
      ams3: { city: Amsterdam, country: NL }
      lon1: { city: London, country: GB }
      fra1: { city: Frankfurt, country: DE }
      tor1: { city: Toronto, country: CA }
      blr1: { city: Bangalore, country: IN }
      sgp1: { city: Singapore, country: SG }
      syd1: { city: Sydney, country: AU }

  - id: aws
    name: AWS
    vendors: [Amazon EC2]
    cloud_init: [aws]
    hosts:
      - '\.(?P<region>[a-z]{2}-[a-z]+-\d)\.rds\.amazonaws\.com$'
      - '\.(?P<region>[a-z]{2}-[a-z]+-\d)\.cache\.amazonaws\.com$'
      - '(^|\.)s3[.-](?P<region>[a-z]{2}-[a-z]+-\d)\.amazonaws\.com$'
      - '\.(?P<region>[a-z]{2}-[a-z]+-\d)\.docdb\.amazonaws\.com$'
      - '^aws-\d+-(?P<region>[a-z]{2}-[a-z]+-\d)\.pooler\.supabase\.com$'
      - '\.(?P<region>[a-z]{2}-[a-z]+-\d)\.aws\.neon\.tech$'
    regions:
      us-east-1: { city: Virginia, country: US }
      us-east-2: { city: Ohio, country: US }
      us-west-1: { city: California, country: US }
      us-west-2: { city: Oregon, country: US }
      ca-central-1: { city: Montreal, country: CA }
      ca-west-1: { city: Calgary, country: CA }
      mx-central-1: { city: Querétaro, country: MX }
      sa-east-1: { city: São Paulo, country: BR }
      eu-west-1: { city: Dublin, country: IE }
      eu-west-2: { city: London, country: GB }
      eu-west-3: { city: Paris, country: FR }
      eu-central-1: { city: Frankfurt, country: DE }
      eu-central-2: { city: Zurich, country: CH }
      eu-north-1: { city: Stockholm, country: SE }
      eu-south-1: { city: Milan, country: IT }
      eu-south-2: { city: Spain, country: ES }
      af-south-1: { city: Cape Town, country: ZA }
      me-south-1: { city: Bahrain, country: BH }
      me-central-1: { city: UAE, country: AE }
      il-central-1: { city: Tel Aviv, country: IL }
      ap-south-1: { city: Mumbai, country: IN }
