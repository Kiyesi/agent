# Pay, reached through Docker's resolver.
server {
	listen 80;
	server_name pay.example.com;
	resolver 127.0.0.11 valid=30s;
	set $up http://billing:8080;
	location / {
		proxy_pass $up;
	}
}

server {
	listen 80 default_server;
	server_name _;
	return 444;
}

server {
	server_name legacy.example.com;
	location /app/ {
		proxy_pass "http://127.0.0.1:9999/";
	}
}
